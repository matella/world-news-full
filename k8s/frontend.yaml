apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: world-news
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
      - name: frontend
        image: <REGISTRY>/world-news/frontend:latest
        ports: [{ containerPort: 3000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: world-news
spec:
  ports: [{ port: 3000, targetPort: 3000 }]
  selector: { app: frontend }
