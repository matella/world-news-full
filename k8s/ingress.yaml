apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: world-news-ingress
  namespace: world-news
  annotations:
    kubernetes.io/ingress.class: traefik   # or use nginx depending on your ingress controller
spec:
  rules:
  - host: news.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port: { number: 3000 }
  - host: api.news.local
    http:
      paths:
      - path: /graphql
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port: { number: 8000 }
