apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: world-news
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
      - name: postgres
        image: postgres:18
        env:
        - name: POSTGRES_USER
          value: "worldnews"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        - name: POSTGRES_DB
          value: "worldnews"
        ports: [{ containerPort: 5432 }]
        # Postgres 18 keeps versioned PGDATA under this parent directory.
        volumeMounts: [{ name: pgdata, mountPath: /var/lib/postgresql }]
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: world-news
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: world-news
spec:
  ports: [{ port: 5432, targetPort: 5432 }]
  selector: { app: postgres }
  clusterIP: None
