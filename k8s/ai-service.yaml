apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: world-news
spec:
  replicas: 1
  selector: { matchLabels: { app: ai-service } }
  template:
    metadata: { labels: { app: ai-service } }
    spec:
      containers:
      - name: ai-service
        image: <REGISTRY>/world-news/ai-service:latest
        ports: [{ containerPort: 9000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: world-news
spec:
  ports: [{ port: 9000, targetPort: 9000 }]
  selector: { app: ai-service }
