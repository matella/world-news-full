apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: world-news
spec:
  replicas: 1
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      serviceAccountName: api-gateway-sa
      automountServiceAccountToken: false
      containers:
      - name: api-gateway
        image: <REGISTRY>/world-news/api-gateway:latest
        ports:
        - containerPort: 8000
        env:
          - name: DATABASE_URL
            value: "postgres://worldnews:worldnews@postgres:5432/worldnews"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
            storage: "500Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: world-news
spec:
  ports: [{ port: 8000, targetPort: 8000 }]
  selector: { app: api-gateway }
