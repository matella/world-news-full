[package]
name = "world-news"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
axum = "0.8"
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
