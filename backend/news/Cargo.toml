[package]
name = "world-news"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
axum = "0.8"
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "chrono", "json"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
url = "2"
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
http-body-util = "0.1"
argon2 = { version = "0.6", features = ["zeroize"] }
cookie = "0.18.2"
getrandom = "0.4"
subtle = "2"
zeroize = "1"
unicode-normalization = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
feed-rs = "3"
quick-xml = { version = "0.42", features = ["encoding"] }
ipnet = "2"
httpdate = "1"
html_scraper = { package = "scraper", version = "0.29", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
